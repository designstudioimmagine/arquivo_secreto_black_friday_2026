/* Layout: um "arquivo" — logo-caixa no topo, pastas numa janela de sistema, cada pasta abre uma janela própria */
:root{
  color-scheme:light;
  --paper:#F9F8F4; --sheet:#FEFDFC; --ink:#1D1D1B; --ink-soft:#57554F; --line:#C4C3C3; --night:#141414;
  --blue:#C6E4FD;   --blue-a:#9FCEFA;
  --green:#D3EDC6;  --green-a:#C2E89D;
  --yellow:#FAFB96; --yellow-a:#FCE952;
  --pink:#FED3E4;   --pink-a:#FBB6D4;
  --lilac:#D3CDFC;  --lilac-a:#C2B7FA;
  --orange:#FDCC95; --orange-a:#FCBC74;
  --scrim:rgba(20,20,20,.38);
  --font:"Konnect",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --stroke:2.5px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- LOGO ---------- */
.logo{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,40px);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.logo svg{display:block;overflow:visible}
.logo .lg-box{width:min(46vw,440px);height:auto}
.logo .lg-title{width:min(40vw,400px);height:auto}
.lg-stack{transform-box:fill-box;transform-origin:50% 47.6%}
.lg-fly,.lg-sparks>*,.lg-tsparks>*{transform-box:fill-box;transform-origin:50% 50%}
.lg-t1,.lg-t2,.lg-t3,.lg-t4{transform-box:fill-box}

/* entrada */
.intro .lg-boxwrap{animation:boxIn .8s var(--spring) both}
.intro .lg-stack{animation:stackIn .9s var(--spring) .25s both}
.intro .lg-fly-y{animation:flyY 1s var(--spring) .55s both}
.intro .lg-fly-p{animation:flyP 1s var(--spring) .7s both}
.intro .lg-sparks>*,.intro .lg-tsparks>*{animation:spark .5s var(--spring) both}
.intro .lg-sparks>*:nth-child(1){animation-delay:.95s}.intro .lg-sparks>*:nth-child(2){animation-delay:1.02s}.intro .lg-sparks>*:nth-child(3){animation-delay:1.09s}
.intro .lg-tsparks>*:nth-child(1){animation-delay:1.25s}.intro .lg-tsparks>*:nth-child(2){animation-delay:1.32s}.intro .lg-tsparks>*:nth-child(3){animation-delay:1.39s}
.intro .lg-t1{animation:rise .7s var(--ease) .15s both}
.intro .lg-t2{animation:rise .7s var(--ease) .25s both}
.intro .lg-t3{animation:rise .7s var(--ease) .35s both}
.intro .lg-t4{animation:rise .7s var(--ease) .5s both}
@keyframes boxIn{from{transform:translateY(24px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
@keyframes stackIn{from{transform:scaleY(.82)}to{transform:none}}
@keyframes flyY{from{transform:translate(-90px,150px) rotate(-30deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes flyP{from{transform:translate(-150px,60px) rotate(25deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes spark{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}

/* flutuação contínua discreta */
.idle .lg-fly-y{animation:floatY 4.6s ease-in-out infinite}
.idle .lg-fly-p{animation:floatP 5.2s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:none}50%{transform:translate(3px,-7px) rotate(3deg)}}
@keyframes floatP{0%,100%{transform:none}50%{transform:translate(-3px,-6px) rotate(-4deg)}}

/* cutucada: hover no desktop, toque no celular */
.poke .lg-stack{animation:shuffle .75s var(--ease)}
.poke .lg-fly-y{animation:hopY .8s var(--spring)}
.poke .lg-fly-p{animation:hopP .8s var(--spring) .06s}
.poke .lg-sparks>*,.poke .lg-tsparks>*{animation:sparkPulse .6s var(--spring)}
@keyframes shuffle{0%{transform:none}30%{transform:scaleY(1.07) skewX(-1.2deg)}55%{transform:scaleY(.97) skewX(.8deg)}80%{transform:scaleY(1.03)}100%{transform:none}}
@keyframes hopY{0%{transform:none}40%{transform:translate(10px,-22px) rotate(12deg)}100%{transform:none}}
@keyframes hopP{0%{transform:none}40%{transform:translate(16px,-14px) rotate(-14deg)}100%{transform:none}}
@keyframes sparkPulse{0%,100%{transform:none}40%{transform:scale(1.35)}}

/* ---------- TELAS ---------- */
.screen{padding-block:clamp(28px,6vw,64px) 48px}
.screen[hidden]{display:none!important}
.screen.enter{animation:screenIn .5s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Nível 1 */
#home{display:flex;flex-direction:column;align-items:center;gap:clamp(36px,6vw,64px);min-height:80vh;justify-content:center}
.pick{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.pick h2{margin:0;font-weight:400;font-size:clamp(18px,2.2vw,22px);text-align:center;text-wrap:balance}
.pick h2 b{font-weight:700}
.stores{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:16px;justify-content:center;width:100%}
.store{display:flex;align-items:center;gap:14px;padding:18px 20px;border:var(--stroke) solid var(--ink);border-radius:16px;background:var(--sheet);
  cursor:pointer;text-align:left;box-shadow:4px 4px 0 var(--ink);transition:transform .25s var(--spring),box-shadow .25s var(--spring),background-color .2s}
.store:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.store:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.store[data-store="brasil"]:hover{background:var(--green)}
.store[data-store="europa"]:hover{background:var(--blue)}
.store .flag{width:40px;height:28px;flex:none;border:2px solid var(--ink);border-radius:6px;overflow:hidden;display:block}
.store .flag svg{display:block;width:100%;height:100%}
.store span{font-weight:700;font-size:clamp(16px,2vw,19px);letter-spacing:.04em;flex:1}
.store .chev{width:20px;height:20px;flex:none;transition:transform .25s var(--spring)}
.store:hover .chev{transform:translateX(4px)}

/* Nível 2 */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo.small{gap:10px;justify-content:flex-start}
.logo.small .lg-box{width:clamp(84px,12vw,120px)}
.logo.small .lg-title{width:clamp(130px,17vw,190px)}
.back{display:inline-flex;align-items:center;gap:8px;border:var(--stroke) solid var(--ink);background:var(--sheet);border-radius:999px;padding:9px 16px 9px 12px;
  font-size:14px;font-weight:500;cursor:pointer;transition:background-color .2s}
.back:hover{background:var(--yellow)}
.back svg{width:16px;height:16px}

.finder{margin-top:clamp(24px,4vw,40px);border:var(--stroke) solid var(--ink);border-radius:22px;background:var(--sheet);overflow:hidden;box-shadow:0 18px 40px -24px rgba(29,29,27,.35)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:var(--stroke) solid var(--ink);background:var(--paper)}
.dots{display:flex;gap:7px;flex:none}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.dots i:nth-child(1){background:#F26B6B}.dots i:nth-child(2){background:#F8D34A}.dots i:nth-child(3){background:#5CC46B}
.path{font-size:14px;color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path b{color:var(--ink);font-weight:700}
.region{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 24px 4px}
.region h1{margin:0;font-size:clamp(26px,4vw,40px);font-weight:300;letter-spacing:-.01em;line-height:1.05;display:flex;align-items:center;gap:12px}
.region h1 b{font-weight:700}
.region .flag{width:38px;height:26px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;display:inline-block;flex:none}
.region .flag svg{display:block;width:100%;height:100%}
.region p{margin:0;color:var(--ink-soft);font-size:15px;flex-basis:100%}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(18px,3vw,34px) clamp(14px,2.6vw,28px);padding:clamp(22px,4vw,40px) clamp(14px,3vw,32px) clamp(28px,4vw,44px)}

/* Pasta */
.folder{--c:var(--blue);--a:var(--blue-a);width:clamp(140px,17vw,180px);background:none;border:0;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;-webkit-tap-highlight-color:transparent}
.fobj{position:relative;aspect-ratio:200/160;width:100%;transition:transform .35s var(--spring)}
.fobj svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.f-back{fill:var(--a)}
.f-body{fill:var(--c)}
.f-sheet{transition:transform .4s var(--spring)}
.f-front{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s var(--spring)}
.tag{position:absolute;left:9%;bottom:12%;max-width:84%;background:var(--a);border:2px solid var(--ink);border-radius:7px;padding:4px 9px 3px;
  font-weight:700;font-size:clamp(11px,1.3vw,14px);letter-spacing:.02em;line-height:1.15;white-space:nowrap;transition:transform .4s var(--spring)}
.folder .cap{font-size:14px;line-height:1.35;color:var(--ink-soft)}
.folder .cap b{color:var(--ink);font-weight:700}
.folder:hover .fobj,.folder:focus-visible .fobj{transform:translateY(-6px) rotate(-1.5deg)}
.folder:hover .f-sheet,.folder:focus-visible .f-sheet{transform:translateY(-18px)}
.folder:hover .f-front,.folder:focus-visible .f-front{transform:perspective(400px) rotateX(-14deg)}
.folder:hover .tag{transform:translateY(3px)}
.folder.opening .f-sheet{transform:translateY(-34px)}
.folder.opening .f-front{transform:perspective(400px) rotateX(-28deg)}
.c-blue{--c:var(--blue);--a:var(--blue-a)}.c-green{--c:var(--green);--a:var(--green-a)}.c-yellow{--c:var(--yellow);--a:var(--yellow-a)}
.c-pink{--c:var(--pink);--a:var(--pink-a)}.c-lilac{--c:var(--lilac);--a:var(--lilac-a)}.c-orange{--c:var(--orange);--a:var(--orange-a)}

.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--ink-soft)}

/* Nível 3 — janela */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.win{pointer-events:auto;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--sheet);
  border:var(--stroke) solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(20,20,20,.45);will-change:transform}
.win .bar{background:var(--sheet)}
.win .path{flex:1}
.x{width:36px;height:36px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--sheet);cursor:pointer;transition:transform .25s var(--spring),background-color .2s}
.x:hover{background:var(--a);transform:rotate(90deg)}
.x svg{width:16px;height:16px}
.whead{background:var(--c);border-bottom:var(--stroke) solid var(--ink);padding:22px 24px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;position:relative}
.whead .tag{position:static;font-size:clamp(17px,2.4vw,22px);padding:6px 14px 5px;border-width:var(--stroke);border-radius:10px}
.whead p{margin:0;font-size:16px;max-width:42ch}
.whead p b{font-weight:700}
.whead .zap{position:absolute;right:22px;top:16px;width:38px;height:38px}
.wbody{overflow-y:auto;overscroll-behavior:contain;padding:22px 24px 26px;display:flex;flex-direction:column;gap:22px}
.win.fresh .wbody>*{animation:rise .5s var(--ease) both}
.win.fresh .wbody>*:nth-child(2){animation-delay:.06s}.win.fresh .wbody>*:nth-child(3){animation-delay:.12s}.win.fresh .wbody>*:nth-child(4){animation-delay:.18s}

/* conteúdo */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start}
.ck{width:24px;height:24px;border-radius:50%;background:var(--ink);display:grid;place-items:center;margin-top:1px}
.ck svg{width:13px;height:13px}
.checks strong{display:block;font-weight:700;font-size:17px;line-height:1.3}
.checks span{display:block;color:var(--ink-soft);font-size:15px;margin-top:2px}
.offer{border:2px dashed var(--ink);border-radius:16px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;background:var(--paper)}
.price{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.price .was{font-size:15px;color:var(--ink-soft)}
.price .was s{text-decoration-thickness:1.5px}
.price .now{font-size:clamp(34px,6vw,46px);font-weight:700;line-height:1;letter-spacing:-.02em}
.price .now small{font-size:.45em;font-weight:500;margin-right:4px;letter-spacing:0}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.05em;
  padding:14px 22px;border-radius:12px;border:var(--stroke) solid var(--ink);transition:transform .25s var(--spring),box-shadow .25s var(--spring),background-color .2s,color .2s;white-space:nowrap}
.cta svg{width:16px;height:16px;transition:transform .25s var(--spring)}
.cta:hover{background:var(--a);color:var(--ink);box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
.cta:hover svg{transform:translateX(3px)}
.cta.sm{padding:10px 14px;font-size:13px;border-radius:10px}
.cta.wide{width:100%}

.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 14px 14px 16px;border:2px solid var(--ink);border-radius:14px;background:var(--paper)}
.pct{font-weight:700;font-size:22px;line-height:1;background:var(--a);border:2px solid var(--ink);border-radius:9px;padding:7px 9px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .nm{font-size:16px;line-height:1.3}
.row .nm small{display:block;color:var(--ink-soft);font-size:13px}

.blocks{display:grid;gap:14px}
.blk{border:2px solid var(--ink);border-radius:16px;padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.blk h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.blk .big{font-size:clamp(30px,5vw,38px);font-weight:700;line-height:1;letter-spacing:-.02em}
.blk p{margin:0;color:var(--ink-soft);font-size:15px}
.blk p b{color:var(--ink)}
.chip{align-self:flex-start;background:var(--a);border:2px solid var(--ink);border-radius:999px;padding:3px 10px 2px;font-size:13px;font-weight:700}

.sec{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.sec + .sec{border-top:2px dashed var(--line);padding-top:22px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--ink-soft)}
.sec h3{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.sec > p{margin:0;color:var(--ink-soft)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{display:grid;grid-template-columns:minmax(118px,auto) minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper);border:2px solid var(--ink)}
.ladder .lv{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.ladder .lv small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft)}
.ladder li:nth-child(1){background:var(--blue)}.ladder li:nth-child(2){background:var(--green)}.ladder li:nth-child(3){background:var(--yellow)}.ladder li:nth-child(4){background:var(--pink)}
.ladder .gift{font-size:15px;line-height:1.3}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.facts li{border:2px solid var(--ink);border-radius:999px;padding:5px 12px 4px;font-size:14px;background:var(--paper)}
.coupon{display:flex;align-items:stretch;border:2px dashed var(--ink);border-radius:14px;overflow:hidden;background:var(--sheet)}
.coupon code{flex:1;min-width:0;font-family:var(--font);font-weight:700;font-size:clamp(15px,4.2vw,21px);letter-spacing:.04em;padding:12px 14px;display:flex;align-items:center;white-space:nowrap;overflow-x:auto;user-select:all}
.copy{display:inline-flex;align-items:center;gap:8px;border:0;border-left:2px dashed var(--ink);background:var(--a);padding:0 14px;font-weight:700;font-size:13px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;flex:none;transition:background-color .2s}
.copy:hover{background:var(--c)}
.copy svg{width:18px;height:18px}
.copy.done{background:var(--green)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13px;color:var(--ink-soft)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 20px;font-weight:500;font-size:15px;display:flex;gap:10px;align-items:center;transition:opacity .25s,transform .35s var(--spring);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;flex:none}

@media (max-width:720px){
  .logo.big{flex-direction:column;gap:6px}
  .logo.big .lg-box{width:min(78vw,340px)}
  .logo.big .lg-title{width:min(80vw,330px)}
  .stores{grid-template-columns:minmax(0,340px)}
  .logo.small .lg-title{display:none}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .cta{grid-column:1 / -1}
  .whead,.wbody{padding-left:18px;padding-right:18px}
  .region{padding-left:18px;padding-right:18px}
  .offer .cta{width:100%}
  .win{border-radius:18px}
}
@media (max-width:420px){
  .folder{width:calc(50% - 8px)}
  .grid{gap:22px 14px;padding-left:12px;padding-right:12px}
  .ladder li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

  el.addEventListener('click', poke);
  el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); poke(); } });
  if (!withIntro) el.classList.add('idle');
}
setupLogo($('#logoBig'), true);
setupLogo($('#logoSmall'), false);

/* ---------- pastas ---------- */
function folderSVG(){
  return `<svg viewBox="0 0 200 160" aria-hidden="true">
    <rect class="f-back" x="58" y="10" width="138" height="140" rx="11" stroke="#1D1D1B" stroke-width="4"/>
    <g class="f-sheet"><rect x="22" y="26" width="150" height="120" rx="6" fill="#FEFDFC" stroke="#1D1D1B" stroke-width="3.5"/>
      <path d="M40 46h80M40 60h108M40 74h96" stroke="#C4C3C3" stroke-width="4" stroke-linecap="round"/></g>
    <path class="f-body f-front" d="M4 15Q4 4 15 4H70Q79 4 83 11L86 16Q89 22 98 22H181Q190 22 190 31V146Q190 156 180 156H14Q4 156 4 146Z" stroke="#1D1D1B" stroke-width="4" stroke-linejoin="round"/>
  </svg>`;
}
function renderGrid(key){
  const st = STORES[key];
  $('#grid').innerHTML = st.folders.map((f,i)=>`
    <button class="folder c-${f.color}" type="button" data-i="${i}" aria-haspopup="dialog" aria-label="Abrir pasta ${f.label.replace('&amp;','e')}">
      <div class="fobj">${folderSVG()}<span class="tag">${f.label}</span></div>
      <div class="cap">${f.desc}</div>
    </button>`).join('');
  $('#regionTitle').innerHTML = `<span class="flag">${FLAGS[st.flag]}</span><span>${st.name.split(' ')[0]} <b>${st.name.split(' ')[1]}</b></span>`;
  $('#finderPath').innerHTML = `Meus Arquivos / Descontos / <b>${st.name}</b>`;
}

/* ---------- conteúdo da janela ---------- */
const cta = (txt,href,cls='') => `<a class="cta ${cls}" href="${href}" target="_blank" rel="noopener">${txt}${ICON.arrow}</a>`;
const coupon = code => `<div class="coupon"><code>#${code}</code><button class="copy" type="button" data-code="${code}" aria-label="Copiar cupom ${code}">${ICON.copy}<span>COPIAR</span></button></div>`;
function body(f){
  if (f.kind==='combo') return `
    <ul class="checks">${f.items.map(([t,s])=>`<li><i class="ck">${ICON.check}</i><div><strong>${t}</strong>${s?`<span>${s}</span>`:''}</div></li>`).join('')}</ul>
    <div class="offer">
      <div class="price"><span class="was">De <s>${f.was}</s> por</span><span class="now"><small>R$</small>${f.now}</span></div>
      ${cta(f.cta,f.href)}
    </div>`;
  if (f.kind==='rows') return `<div class="rows">${f.rows.map(([n,h])=>`
      <div class="row"><span class="pct">25%</span><span class="nm">OFF em <b>${n}</b></span>${cta('COMPRE AGORA',h,'sm')}</div>`).join('')}</div>`;
  if (f.kind==='blocks') return `
    <div class="blocks">${f.blocks.map(b=>`<div class="blk"><h3>${b.h}</h3><div class="big">${b.big}</div><span class="chip">${b.chip}</span></div>`).join('')}</div>
    ${cta(f.cta,f.href,'wide')}`;
  if (f.kind==='cupons') return `
    <div class="sec">
      <span class="eyebrow">Brindes por valor de compra</span>
      <h3>Quanto mais cor no carrinho, mais brindes</h3>
      <ol class="ladder">
        <li><span class="lv"><small>compras acima de</small>R$ 199</span><span class="gift">Círculo Cromático de Primavera</span></li>
        <li><span class="lv"><small>compras acima de</small>R$ 399</span><span class="gift">Adesivos Cores da Essência</span></li>
        <li><span class="lv"><small>compras acima de</small>R$ 599</span><span class="gift">Kit Liso de Temperaturas Ed. 1</span></li>
        <li><span class="lv"><small>compras acima de</small>R$ 799</span><span class="gift">Combo Círculos 4 Estações <b>+ Frete Grátis Brasil</b></span></li>
      </ol>
      ${coupon('CODIGOSECRETO')}
      <div class="actions">${cta('COMPRAR AGORA',LOJA)}</div>
    </div>
    <div class="sec">
      <span class="eyebrow">Experiência presencial</span>
      <h3>ColorDay com Luciana</h3>
      <p>Experiência presencial em turma reduzida.</p>
      <ul class="facts"><li>Turma com 10 participantes</li><li>Dois sábados presenciais</li></ul>
      <div class="price"><span class="was">Valor especial</span><span class="now"><small>R$</small>1.997,00</span></div>
      ${coupon('COLORDAY2026')}
      <div class="actions">${cta('AGENDAR AGORA',LOJA)}</div>
    </div>
    <div class="sec">
      <span class="eyebrow">Primeira compra</span>
      <h3>5% OFF na primeira compra</h3>
      ${coupon('BEMVINDO5')}
      <div class="actions">${cta('COMPRAR AGORA',LOJA)}</div>
    </div>`;
  return '';
}

/* ---------- navegação ---------- */
let current = null, openFolder = null, busy = false;
function show(key, push=true){
  const home=$('#home'), store=$('#store');
  if (key && STORES[key]){
    current=key; renderGrid(key);
    home.hidden=true; store.hidden=false; store.classList.remove('enter'); void store.offsetWidth; store.classList.add('enter');
    if (push && location.hash!=='#'+key) history.pushState(null,'','#'+key);
  } else {
    current=null; store.hidden=true; home.hidden=false; home.classList.remove('enter'); void home.offsetWidth; home.classList.add('enter');
    if (push && location.hash) history.pushState(null,'',location.pathname+location.search);
  }
  window.scrollTo({top:0});
}
document.querySelectorAll('.store').forEach(b=>b.addEventListener('click',()=>show(b.dataset.store)));
$('#backBtn').addEventListener('click',()=>show(null));
window.addEventListener('popstate',()=>{ if (openFolder) closeWin(true); show(location.hash.slice(1)||null,false); });

/* ---------- abrir / fechar pasta ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#grid').addEventListener('click', e=>{
  const btn = e.target.closest('.folder'); if (!btn || busy) return;
  const f = STORES[current].folders[+btn.dataset.i];
  btn.classList.add('opening');
  setTimeout(()=>openWin(f,btn), reduce?0:170);
});
function fromRect(btn){
  const r = btn.querySelector('.fobj').getBoundingClientRect(), w = $('#win').getBoundingClientRect();
  return `translate(${(r.left+r.width/2)-(w.left+w.width/2)}px,${(r.top+r.height/2)-(w.top+w.height/2)}px) scale(${r.width/w.width},${r.height/w.height})`;
}
function openWin(f,btn){
  busy=true; openFolder=btn;
  const win=$('#win');
  win.className=`win c-${f.color}`;
  $('#winTag').innerHTML=f.label; $('#winDesc').innerHTML=f.desc;
  $('#winPath').innerHTML=`${STORES[current].name} / <b>${f.id}</b>`;
  $('#winBody').innerHTML=body(f); $('#winBody').scrollTop=0;
  $('#scrim').hidden=false; $('#modal').hidden=false; document.body.classList.add('locked');
  requestAnimationFrame(()=>$('#scrim').classList.add('on'));
  void win.offsetWidth; win.classList.add('fresh');
  const done=()=>{busy=false; $('#closeBtn').focus({preventScroll:true});};
  if (reduce){done();return;}
  win.animate([{transform:fromRect(btn),opacity:.3,borderRadius:'40px'},{transform:'none',opacity:1,borderRadius:'22px'}],
    {duration:460,easing:'cubic-bezier(.2,.9,.25,1.05)'}).onfinish=done;
}
function closeWin(instant){
  if (!openFolder) return;
  const btn=openFolder, win=$('#win');
  const end=()=>{ $('#modal').hidden=true; $('#scrim').hidden=true; document.body.classList.remove('locked'); win.classList.remove('fresh');
    btn.classList.remove('opening'); openFolder=null; busy=false; if(!instant && document.contains(btn)) btn.focus({preventScroll:true}); };
  $('#scrim').classList.remove('on');
  if (reduce||instant||!document.contains(btn)){end();return;}
  busy=true;
  win.animate([{transform:'none',opacity:1},{transform:fromRect(btn),opacity:0}],{duration:320,easing:'cubic-bezier(.5,0,.75,0)'}).onfinish=end;
}
$('#closeBtn').addEventListener('click',()=>closeWin());
$('#modal').addEventListener('click',e=>{ if (e.target.id==='modal') closeWin(); });
document.addEventListener('keydown',e=>{
  if (!openFolder) return;
  if (e.key==='Escape'){ closeWin(); return; }
  if (e.key==='Tab'){ // manter o foco dentro da janela
    const f=[...$('#win').querySelectorAll('a,button')]; if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
    else if (!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/* ---------- copiar cupom ---------- */
let tt;
function toast(msg){ $('#toastMsg').textContent=msg; $('#toast').classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>$('#toast').classList.remove('on'),2200); }
function fallbackCopy(code, codeEl){
  try{
    const ta=document.createElement('textarea'); ta.value=code; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove(); if (ok) return true;
  }catch(_){}
  const r=document.createRange(); r.selectNodeContents(codeEl); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  return false;
}
$('#winBody').addEventListener('click', e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  const code=b.dataset.code, codeEl=b.parentElement.querySelector('code');
  const success=()=>{ b.classList.add('done'); b.innerHTML=`${ICON.ok}<span>COPIADO</span>`; toast('Cupom copiado!');
    setTimeout(()=>{b.classList.remove('done'); b.innerHTML=`${ICON.copy}<span>COPIAR</span>`;},2200); };
  const fail=()=>{ if (fallbackCopy(code,codeEl)) success(); else toast('Cupom selecionado: copie com Ctrl+C'); };
  try{ navigator.clipboard.writeText(code).then(success,fail); }catch(_){ fail(); }
});

/* rota inicial */
const start=location.hash.slice(1);
if (STORES[start]) show(start,false);
})();
</script>

</body>
</html>
